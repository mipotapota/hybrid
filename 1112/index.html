<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoveON - 오늘도 한 걸음 더</title>
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- 로딩 스플래시 화면 -->
    <div id="splash-screen">
        <div class="splash-content">
            <!-- 짬뽕 로고 -->
            <div class="logo-animation">
                <svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <!-- 배경 원 -->
                    <circle cx="100" cy="100" r="90" fill="#3DDC97" opacity="0.1"/>
                    
                    <!-- MoveON 로고 -->
                    <g transform="translate(100, 70)">
                        <!-- O 링 -->
                        <circle cx="0" cy="0" r="35" fill="none" stroke="#3DDC97" stroke-width="8" class="ring-pulse"/>
                        
                        <!-- 달리는 사람 (애니메이션) -->
                        <g class="runner-animate">
                            <circle cx="0" cy="-15" r="8" fill="#3DDC97"/>
                            <line x1="0" y1="-7" x2="0" y2="12" stroke="#3DDC97" stroke-width="5" stroke-linecap="round"/>
                            <line x1="0" y1="2" x2="-12" y2="-5" stroke="#3DDC97" stroke-width="4" stroke-linecap="round"/>
                            <line x1="0" y1="2" x2="12" y2="6" stroke="#3DDC97" stroke-width="4" stroke-linecap="round"/>
                            <line x1="0" y1="12" x2="-8" y2="24" stroke="#3DDC97" stroke-width="4" stroke-linecap="round"/>
                            <line x1="0" y1="12" x2="10" y2="22" stroke="#3DDC97" stroke-width="4" stroke-linecap="round"/>
                        </g>
                    </g>
                </svg>
                <h1 class="logo-text">Move<span class="highlight">ON</span></h1>
                <p class="logo-slogan">오늘도 한 걸음 더</p>
            </div>
            <div class="loading-spinner"></div>
        </div>
    </div>

    <!-- 로그인 화면 -->
    <div id="auth-screen" style="display: none;">
        <div class="auth-container">
            <div class="auth-logo">
                <svg width="120" height="120" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="100" cy="100" r="90" fill="#3DDC97" opacity="0.1"/>
                    <g transform="translate(100, 100)">
                        <circle cx="0" cy="0" r="35" fill="none" stroke="#3DDC97" stroke-width="8"/>
                        <g>
                            <circle cx="0" cy="-15" r="8" fill="#3DDC97"/>
                            <line x1="0" y1="-7" x2="0" y2="12" stroke="#3DDC97" stroke-width="5" stroke-linecap="round"/>
                            <line x1="0" y1="2" x2="-12" y2="-5" stroke="#3DDC97" stroke-width="4" stroke-linecap="round"/>
                            <line x1="0" y1="2" x2="12" y2="6" stroke="#3DDC97" stroke-width="4" stroke-linecap="round"/>
                            <line x1="0" y1="12" x2="-8" y2="24" stroke="#3DDC97" stroke-width="4" stroke-linecap="round"/>
                            <line x1="0" y1="12" x2="10" y2="22" stroke="#3DDC97" stroke-width="4" stroke-linecap="round"/>
                        </g>
                    </g>
                </svg>
                <h1>Move<span class="highlight">ON</span></h1>
                <p>오늘도 한 걸음 더</p>
            </div>

            <div class="auth-tabs">
                <button class="tab-btn active" data-tab="login">로그인</button>
                <button class="tab-btn" data-tab="signup">회원가입</button>
            </div>

            <!-- 로그인 폼 -->
            <div id="login-form" class="auth-form">
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="login-email" placeholder="이메일" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="login-password" placeholder="비밀번호" required>
                </div>
                <button class="btn-primary" onclick="login()">
                    <i class="fas fa-sign-in-alt"></i> 로그인
                </button>
                <button class="btn-secondary" onclick="loginWithGoogle()">
                    <i class="fab fa-google"></i> Google로 시작하기
                </button>
            </div>

            <!-- 회원가입 폼 -->
            <div id="signup-form" class="auth-form" style="display: none;">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="signup-name" placeholder="닉네임" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="signup-email" placeholder="이메일" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="signup-password" placeholder="비밀번호 (6자 이상)" required>
                </div>
                <div class="input-row">
                    <div class="input-group">
                        <i class="fas fa-birthday-cake"></i>
                        <input type="number" id="signup-age" placeholder="나이" min="1" max="120">
                    </div>
                    <div class="input-group">
                        <i class="fas fa-venus-mars"></i>
                        <select id="signup-gender">
                            <option value="">성별</option>
                            <option value="male">남성</option>
                            <option value="female">여성</option>
                            <option value="other">기타</option>
                        </select>
                    </div>
                </div>
                <button class="btn-primary" onclick="signup()">
                    <i class="fas fa-user-plus"></i> 회원가입
                </button>
            </div>
        </div>
    </div>

    <!-- 메인 앱 화면 -->
    <div id="app-screen" style="display: none;">
        <!-- 상단 헤더 -->
        <header class="app-header">
            <div class="header-logo">
                <svg width="30" height="30" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <g transform="translate(100, 100)">
                        <circle cx="0" cy="0" r="35" fill="none" stroke="#3DDC97" stroke-width="8"/>
                        <circle cx="0" cy="-15" r="8" fill="#3DDC97"/>
                        <line x1="0" y1="-7" x2="0" y2="12" stroke="#3DDC97" stroke-width="5" stroke-linecap="round"/>
                    </g>
                </svg>
                <span>Move<span class="highlight">ON</span></span>
            </div>
            <div class="header-user">
                <span id="header-username">사용자</span>
                <i class="fas fa-bell notification-icon"></i>
            </div>
        </header>

        <!-- 페이지 컨텐츠 -->
        <main class="app-content">
            <!-- 홈 페이지 -->
            <div id="home-page" class="page active">
                <h2 class="page-title">오늘의 추천 운동</h2>
                <div id="today-workout" class="workout-card">
                    <!-- 동적으로 로드됨 -->
                </div>
                <div class="section-title">이번 주 통계</div>
                <div class="stats-grid">
                    <div class="stat-card">
                        <i class="fas fa-fire"></i>
                        <div class="stat-value" id="week-workouts">0</div>
                        <div class="stat-label">완료한 운동</div>
                    </div>
                    <div class="stat-card">
                        <i class="fas fa-clock"></i>
                        <div class="stat-value" id="week-time">0분</div>
                        <div class="stat-label">운동 시간</div>
                    </div>
                    <div class="stat-card">
                        <i class="fas fa-trophy"></i>
                        <div class="stat-value" id="week-streak">0일</div>
                        <div class="stat-label">연속 달성</div>
                    </div>
                </div>
            </div>

            <!-- 운동 기록 페이지 -->
            <div id="record-page" class="page">
                <h2 class="page-title">운동 기록</h2>
                <div id="calendar-container"></div>
                <div class="achievement-section">
                    <h3>이번 달 달성률</h3>
                    <div class="progress-circle" id="month-progress"></div>
                </div>
                <div id="record-list"></div>
            </div>

            <!-- 주변 시설 페이지 -->
            <div id="facility-page" class="page">
                <h2 class="page-title">주변 운동 시설</h2>
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" id="facility-search" placeholder="시설 검색...">
                    <button class="filter-btn"><i class="fas fa-filter"></i></button>
                </div>
                <div id="facility-list"></div>
            </div>

            <!-- 프로필 페이지 -->
            <div id="profile-page" class="page">
                <h2 class="page-title">내 프로필</h2>
                <div class="profile-header">
                    <div class="profile-avatar">
                        <i class="fas fa-user-circle"></i>
                    </div>
                    <div class="profile-info" id="profile-info">
                        <!-- 동적으로 로드됨 -->
                    </div>
                </div>
                <div class="profile-stats">
                    <div class="profile-stat">
                        <div class="stat-number" id="total-workouts">0</div>
                        <div class="stat-text">총 운동</div>
                    </div>
                    <div class="profile-stat">
                        <div class="stat-number" id="achievement-rate">0%</div>
                        <div class="stat-text">달성률</div>
                    </div>
                    <div class="profile-stat">
                        <div class="stat-number" id="favorite-count">0</div>
                        <div class="stat-text">즐겨찾기</div>
                    </div>
                </div>
                <div class="profile-sections">
                    <button class="profile-section-btn" onclick="showFavorites()">
                        <i class="fas fa-star"></i>
                        <span>즐겨찾기한 시설</span>
                        <i class="fas fa-chevron-right"></i>
                    </button>
                    <button class="profile-section-btn" onclick="showAchievements()">
                        <i class="fas fa-trophy"></i>
                        <span>달성한 목표</span>
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </div>

            <!-- 설정 페이지 -->
            <div id="settings-page" class="page">
                <h2 class="page-title">설정</h2>
                
                <div class="settings-section">
                    <h3>사용자 정보</h3>
                    <div class="settings-item" onclick="editProfile()">
                        <i class="fas fa-user-edit"></i>
                        <span>프로필 수정</span>
                        <i class="fas fa-chevron-right"></i>
                    </div>
                </div>

                <div class="settings-section">
                    <h3>알림 설정</h3>
                    <div class="settings-item">
                        <i class="fas fa-bell"></i>
                        <span>운동 알림</span>
                        <label class="toggle">
                            <input type="checkbox" id="notification-toggle">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="settings-item" id="notification-time-setting" style="display: none;">
                        <i class="fas fa-clock"></i>
                        <span>알림 시간</span>
                        <input type="time" id="notification-time" value="09:00">
                    </div>
                </div>

                <div class="settings-section">
                    <h3>앱 설정</h3>
                    <div class="settings-item">
                        <i class="fas fa-moon"></i>
                        <span>다크 모드</span>
                        <label class="toggle">
                            <input type="checkbox" id="dark-mode-toggle">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>

                <div class="settings-section">
                    <h3>데이터 관리</h3>
                    <div class="settings-item" onclick="resetProgress()">
                        <i class="fas fa-redo"></i>
                        <span>달성률 초기화</span>
                        <i class="fas fa-chevron-right"></i>
                    </div>
                </div>

                <div class="settings-section">
                    <button class="btn-danger" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i> 로그아웃
                    </button>
                </div>
            </div>
        </main>

        <!-- 하단 네비게이션 바 -->
        <nav class="bottom-nav">
            <button class="nav-btn active" data-page="home">
                <i class="fas fa-home"></i>
                <span>홈</span>
            </button>
            <button class="nav-btn" data-page="record">
                <i class="fas fa-chart-bar"></i>
                <span>기록</span>
            </button>
            <button class="nav-btn" data-page="facility">
                <i class="fas fa-map-marker-alt"></i>
                <span>시설</span>
            </button>
            <button class="nav-btn" data-page="profile">
                <i class="fas fa-user"></i>
                <span>프로필</span>
            </button>
            <button class="nav-btn" data-page="settings">
                <i class="fas fa-cog"></i>
                <span>설정</span>
            </button>
        </nav>
    </div>

    <!-- JavaScript -->
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
