<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: gap: https://ssl.gstatic.com 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; media-src *; img-src 'self' data: content:;">
  <title>베스킨라빈스 도감 게임</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <!-- 헤더 -->
    <header class="header">
      <div class="logo">
        <img src="images/logo.png" alt="Baskin Robbins" style="width: 80px; height: 80px; border-radius: 50%; background: transparent;">
      </div>
      <h1>베스킨라빈스 도감</h1>
      <p class="subtitle">Team GenCoder - "상상은 우리가, 코드는 AI가!"</p>
    </header>

    <!-- 통계 -->
    <div class="stats">
      <div class="stat-item">
        <span class="stat-value ticket-count">0</span>
        <span class="stat-label">뽑기권</span>
      </div>
      <div class="stat-item">
        <span class="stat-value" id="normal-count">0</span>
        <span class="stat-label">기본맛</span>
      </div>
      <div class="stat-item">
        <span class="stat-value" id="limited-count">0</span>
        <span class="stat-label">리미티드</span>
      </div>
    </div>

    <!-- 포인트 카드 -->
    <div class="card" style="background: linear-gradient(135deg, #FFD700, #FFA500); border: none; box-shadow: 0 4px 15px rgba(255, 165, 0, 0.3);">
      <div style="display: flex; align-items: center; justify-content: space-between; color: white;">
        <div style="display: flex; align-items: center; gap: 15px;">
          <div style="font-size: 48px;">💎</div>
          <div>
            <div style="font-size: 28px; font-weight: bold;" id="home-points">0</div>
            <div style="font-size: 13px; opacity: 0.9;">이달의 맛 포인트</div>
          </div>
        </div>
        <div style="text-align: right;">
          <div style="font-size: 14px; opacity: 0.9;">다음 보상까지</div>
          <div style="font-size: 20px; font-weight: bold;" id="points-to-next">300pt</div>
        </div>
      </div>
    </div>

    <!-- 진행률 -->
    <div class="card">
      <h2 class="card-title">도감 완성도</h2>
      
      <div class="progress-container" id="normal-progress">
        <div class="progress-label">
          <span>기본맛 도감</span>
          <span>0/30</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" style="width: 0%">0%</div>
        </div>
      </div>

      <div class="progress-container" id="limited-progress">
        <div class="progress-label">
          <span>리미티드 도감</span>
          <span>0/12</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" style="width: 0%">0%</div>
        </div>
      </div>
    </div>

    <!-- 메뉴 -->
    <div class="menu-grid">
      <a href="pages/attendance.html" class="menu-item">
        <div class="icon">📅</div>
        <div class="label">출석체크</div>
        <div class="badge">+1 뽑기권</div>
      </a>

      <a href="pages/quiz.html" class="menu-item">
        <div class="icon">❓</div>
        <div class="label">퀴즈</div>
        <div class="badge">+1 뽑기권</div>
      </a>

      <a href="pages/gacha.html" class="menu-item">
        <div class="icon">🎰</div>
        <div class="label">뽑기</div>
        <div class="badge ticket-count">0</div>
      </a>

      <a href="pages/collection.html" class="menu-item">
        <div class="icon">📖</div>
        <div class="label">도감</div>
        <div class="badge" id="total-cards">0/42</div>
      </a>

      <a href="pages/reward.html" class="menu-item">
        <div class="icon">🎁</div>
        <div class="label">보상</div>
        <div class="badge">기프티콘</div>
      </a>

      <a href="#" class="menu-item" onclick="showGameGuide(); return false;">
        <div class="icon">💡</div>
        <div class="label">게임방법</div>
        <div class="badge">도움말</div>
      </a>
    </div>

    <!-- 푸터 -->
    <footer class="footer">
      <div class="team-name">Team GenCoder</div>
      <div class="team-motto">"상상은 우리가, 코드는 AI가!"</div>
      <p style="margin-top: 10px; font-size: 12px;">
        김산 · 이예진 · 강민우<br>
        2025.11.05 - 2025.11.12
      </p>
    </footer>
  </div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>

  <script>
    // 홈 화면 전용 스크립트
    document.addEventListener('DOMContentLoaded', function() {
      updateHomeStats();
    });

    function updateHomeStats() {
      const stats = StorageManager.getStats();
      
      // 도감 개수 업데이트
      document.getElementById('normal-count').textContent = stats.normalProgress.current;
      document.getElementById('limited-count').textContent = stats.limitedProgress.current;
      
      // 전체 카드 개수
      const totalCurrent = stats.normalProgress.current + stats.limitedProgress.current;
      const totalMax = stats.normalProgress.total + stats.limitedProgress.total;
      
      // 전체 도감 개수 업데이트 (메뉴 뱃지)
      document.getElementById('total-cards').textContent = `${totalCurrent}/${totalMax}`;
      
      // 진행률 바 업데이트
      const normalProgress = document.querySelector('#normal-progress .progress-label span:last-child');
      if (normalProgress) {
        normalProgress.textContent = `${stats.normalProgress.current}/${stats.normalProgress.total}`;
      }
      const normalFill = document.querySelector('#normal-progress .progress-fill');
      if (normalFill) {
        normalFill.style.width = `${stats.normalProgress.percentage}%`;
        normalFill.textContent = `${stats.normalProgress.percentage}%`;
      }
      
      const limitedProgress = document.querySelector('#limited-progress .progress-label span:last-child');
      if (limitedProgress) {
        limitedProgress.textContent = `${stats.limitedProgress.current}/${stats.limitedProgress.total}`;
      }
      const limitedFill = document.querySelector('#limited-progress .progress-fill');
      if (limitedFill) {
        limitedFill.style.width = `${stats.limitedProgress.percentage}%`;
        limitedFill.textContent = `${stats.limitedProgress.percentage}%`;
      }
      
      // 포인트 업데이트
      const points = stats.limitedPoints || 0;
      document.getElementById('home-points').textContent = points;
      
      // 다음 마일스톤까지 필요한 포인트
      const milestones = stats.pointMilestones;
      const nextMilestone = milestones.nextMilestone;
      const remaining = nextMilestone - points;
      document.getElementById('points-to-next').textContent = remaining > 0 ? `${remaining}pt` : '완료!';
    }
    
    // 게임방법 안내 모달
    function showGameGuide() {
      App.showModal(
        '🎮 게임 방법',
        `
          <div style="text-align: left; line-height: 1.8; color: var(--gray-dark);">
            <h3 style="color: var(--brown-main); margin-bottom: 15px;">📖 기본 플레이</h3>
            <p style="margin-bottom: 15px;">
              1️⃣ <strong style="color: var(--pink-main);">출석체크</strong>로 매일 뽑기권 1장 획득<br>
              2️⃣ <strong style="color: var(--blue-accent);">퀴즈 정답</strong>시 뽑기권 1장 추가<br>
              3️⃣ <strong style="color: var(--brown-main);">뽑기</strong>로 아이스크림 카드 수집<br>
              4️⃣ 중복 카드 3장 = 뽑기권 1장 자동 교환<br>
            </p>
            
            <h3 style="color: var(--brown-main); margin: 20px 0 15px;">🍦 도감 종류</h3>
            <p style="margin-bottom: 15px;">
              <strong style="color: var(--brown-main);">기본맛 도감 (30종)</strong><br>
              • 상시 수집 가능 (확률 ~95%)<br>
              • 완성시 확률형 기프티콘 (최대 40,000원!)<br><br>
              
              <strong style="color: var(--pink-main);">이달의 맛 (12종)</strong><br>
              • 매월 1종씩 변경 (확률 ~5%)<br>
              • 1장당 <strong>100 포인트</strong> 적립!<br>
            </p>
            
            <h3 style="color: var(--brown-main); margin: 20px 0 15px;">💎 포인트 마일스톤</h3>
            <p style="margin-bottom: 10px;">
              300pt (3장) → 싱글 레귤러<br>
              600pt (6장) → 더블 레귤러<br>
              900pt (9장) → 파인트<br>
              1200pt (12장) → 아이스크림 케이크 🎂<br>
            </p>
            
            <div style="margin-top: 20px; padding: 15px; background: linear-gradient(135deg, var(--pink-light), white); border-radius: 10px; text-align: center;">
              <strong style="color: var(--pink-main);">매일 접속해서 도감을 완성하세요!</strong>
            </div>
          </div>
        `
      );
    }
  </script>
</body>
</html>
