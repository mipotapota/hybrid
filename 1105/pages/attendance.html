<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>출석체크 - 베스킨라빈스 도감</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container">
    <!-- 헤더 -->
    <header class="header">
      <div class="logo">📅</div>
      <h1>출석체크</h1>
      <p class="subtitle">매일 출석하고 뽑기권을 받으세요!</p>
    </header>

    <!-- 뽑기권 정보 -->
    <div class="card">
      <h2 class="card-title">보유 뽑기권</h2>
      <div style="text-align: center;">
        <span style="font-size: 64px; font-weight: bold; color: var(--pink-main);" class="ticket-count">0</span>
        <p style="color: var(--gray-dark); margin-top: 10px;">장</p>
      </div>
    </div>

    <!-- 출석 버튼 -->
    <div class="card">
      <h2 class="card-title">오늘의 출석</h2>
      <p style="text-align: center; margin-bottom: 20px; color: var(--gray-dark);">
        오늘 출석하고 뽑기권 1장을 받아가세요!
      </p>
      <button id="attend-btn" class="btn btn-primary btn-full" onclick="doAttendance()">
        ✅ 출석하기
      </button>
    </div>

    <!-- 출석 달력 -->
    <div class="card">
      <h2 class="card-title">이번 달 출석</h2>
      <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; text-align: center;">
        <div style="font-weight: bold; color: var(--pink-main);">일</div>
        <div style="font-weight: bold;">월</div>
        <div style="font-weight: bold;">화</div>
        <div style="font-weight: bold;">수</div>
        <div style="font-weight: bold;">목</div>
        <div style="font-weight: bold;">금</div>
        <div style="font-weight: bold; color: var(--blue-accent);">토</div>
        
        <div style="padding: 10px; background: var(--gray-light); border-radius: 10px;">1</div>
        <div style="padding: 10px; background: var(--gray-light); border-radius: 10px;">2</div>
        <div style="padding: 10px; background: var(--gray-light); border-radius: 10px;">3</div>
        <div style="padding: 10px; background: var(--gray-light); border-radius: 10px;">4</div>
        <div style="padding: 10px; background: var(--pink-light); border-radius: 10px; font-weight: bold;">5</div>
        <div style="padding: 10px; background: var(--gray-light); border-radius: 10px;">6</div>
        <div style="padding: 10px; background: var(--gray-light); border-radius: 10px;">7</div>
      </div>
      <p style="margin-top: 20px; text-align: center; color: var(--gray-dark); font-size: 14px;">
        💖 핑크색은 오늘 날짜입니다
      </p>
    </div>

    <!-- 안내사항 -->
    <div class="card">
      <h2 class="card-title">출석 안내</h2>
      <ul style="line-height: 1.8; color: var(--gray-dark); padding-left: 20px;">
        <li>매일 1회 출석 가능</li>
        <li>출석 시 뽑기권 1장 지급</li>
        <li>자정(00:00)에 출석 초기화</li>
        <li>출석은 누적되지 않아요!</li>
      </ul>
    </div>

    <!-- 네비게이션 -->
    <div style="display: flex; gap: 10px; margin-top: 30px;">
      <a href="../index.html" class="btn btn-secondary" style="flex: 1; text-decoration: none;">
        🏠 홈으로
      </a>
      <a href="quiz.html" class="btn btn-accent" style="flex: 1; text-decoration: none;">
        ❓ 퀴즈 풀기
      </a>
    </div>

    <!-- 푸터 -->
    <footer class="footer">
      <div class="team-name">Team GenCoder</div>
      <div class="team-motto">"상상은 우리가, 코드는 AI가!"</div>
    </footer>
  </div>

  <!-- Scripts -->
  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/app.js"></script>

  <script>
    function doAttendance() {
      App.doAttendance();
      
      // 버튼 상태 업데이트
      setTimeout(() => {
        const stats = StorageManager.getStats();
        if (!stats.canAttend) {
          const btn = document.getElementById('attend-btn');
          btn.classList.add('btn-disabled');
          btn.disabled = true;
          btn.textContent = '✅ 오늘 출석 완료!';
        }
        App.updateUI();
      }, 100);
    }
    
    // 페이지 로드시 UI 업데이트
    window.addEventListener('DOMContentLoaded', function() {
      App.updateUI();
    });
  </script>
</body>
</html>
